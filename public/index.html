<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente de Voz Empático - Prueba Local</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        background: #f4f6f9;
        color: #1e293b;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        background: #1e3a8a;
        color: #fff;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #login-bar {
        background: #e2e8f0;
        padding: 10px 20px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #login-bar input {
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        flex: 1;
      }
      #login-bar button {
        padding: 8px 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.45;
      }
      .msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 2px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: white;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 2px;
      }
      .msg audio {
        margin-top: 8px;
        width: 100%;
        height: 36px;
      }
      footer {
        padding: 16px;
        background: white;
        border-top: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #record-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: none;
        background: #10b981;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        transition:
          transform 0.15s,
          background 0.2s;
      }
      #record-btn.recording {
        background: #ef4444;
        transform: scale(1.08);
        box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
      }
      #status {
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Asistente de Voz Local</strong>
      <span id="user-badge">Sin sesión</span>
    </header>

    <div id="login-bar">
      <input
        type="text"
        id="client-name"
        placeholder="Tu nombre o código de cliente (ej. Ana_01)"
      />
      <button id="start-session-btn">Cargar / Iniciar Sesión</button>
    </div>

    <div id="chat-container"></div>

    <footer>
      <button id="record-btn" disabled>Hablar</button>
      <div id="status">Ingresa tu nombre arriba para activar el micrófono</div>
    </footer>

    <script>
      let sessionId = localStorage.getItem("voice_session_id") || "";
      let clientName = localStorage.getItem("voice_client_name") || "";
      let mediaRecorder = null;
      let audioChunks = [];
      let isRecording = false;

      const nameInput = document.getElementById("client-name");
      const startBtn = document.getElementById("start-session-btn");
      const userBadge = document.getElementById("user-badge");
      const chatContainer = document.getElementById("chat-container");
      const recordBtn = document.getElementById("record-btn");
      const statusText = document.getElementById("status");

      if (clientName) {
        nameInput.value = clientName;
        initSession(clientName);
      }

      startBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        if (!name) return alert("Por favor ingresa tu nombre.");
        initSession(name);
      });

      async function initSession(name) {
        clientName = name;
        // Genera un ID estable por nombre para recuperar el historial del mismo cliente
        sessionId = "sess_" + name.toLowerCase().replace(/[^a-z0-9]/g, "_");
        localStorage.setItem("voice_session_id", sessionId);
        localStorage.setItem("voice_client_name", clientName);
        userBadge.textContent = `Cliente: ${clientName}`;
        recordBtn.disabled = false;
        statusText.textContent =
          'Toca "Hablar" para grabar tu mensaje y vuelve a tocar para enviarlo';

        const res = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, clientName }),
        });
        const data = await res.json();
        chatContainer.innerHTML = "";
        (data.history || []).forEach((m) =>
          appendMessage(m.role, m.content, m.audio_url, false),
        );
      }

      function appendMessage(role, text, audioUrl, autoPlay = false) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        const p = document.createElement("div");
        p.textContent = text;
        div.appendChild(p);

        if (audioUrl) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = audioUrl;
          div.appendChild(audio);
          if (autoPlay) audio.play().catch(() => {});
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      recordBtn.addEventListener("click", async () => {
        if (!isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.onstop = sendAudioToServer;
            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = "Enviar";
            recordBtn.classList.add("recording");
            statusText.textContent =
              'Grabando... toca "Enviar" cuando termines de hablar';
          } catch (err) {
            alert(
              "No se pudo acceder al micrófono. Verifica estar conectado por HTTPS o localhost.",
            );
          }
        } else {
          mediaRecorder.stop();
          mediaRecorder.stream.getTracks().forEach((t) => t.stop());
          isRecording = false;
          recordBtn.textContent = "Hablar";
          recordBtn.classList.remove("recording");
          recordBtn.disabled = true;
          statusText.textContent =
            "Escuchando y preparando una respuesta empática...";
        }
      });

      async function sendAudioToServer() {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const formData = new FormData();
        formData.append("audio", blob, "mensaje.webm");
        formData.append("sessionId", sessionId);
        formData.append("clientName", clientName);

        try {
          const res = await fetch("/api/voice-chat", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (data.error) {
            statusText.textContent = "Error: " + data.error;
          } else {
            appendMessage("user", data.userText);
            appendMessage("assistant", data.assistantText, data.audioUrl, true);
            statusText.textContent = 'Listo. Toca "Hablar" para responder';
          }
        } catch (err) {
          statusText.textContent = "Error de conexión con el servidor local.";
        } finally {
          recordBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
